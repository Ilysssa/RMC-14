- type: entity
  abstract: true
  parent: RMCBaseDoorInvincible
  id: RMCQuadDoorBaseInvincible
  components:
  - type: Sprite
    offset: "1.5, 0"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,3.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - FullTileLayer
  - type: Corrodible
    isCorrodible: false
    structure: true
  - type: Weldable
    time: 3
  - type: WiresVisuals
  - type: ExtensionCableReceiver
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresPanelSecurity
  - type: Wires
    boardName: wires-board-name-airlock
    layoutId: Airlock
  - type: DoorSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Open
    - Close
    - Toggle
    - AutoClose
    - DoorBolt
  - type: DeviceLinkSource
    ports:
    - DoorStatus
  - type: SoundOnOverload
  - type: SpawnOnOverload
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/smash.ogg"

- type: entity
  abstract: true
  parent:
  - CMBaseDoor
  - CMBaseDoorConstructible
  id: RMCQuadDoorBase
  components:
  - type: CMDoubleDoor
  - type: Sprite
    offset: "1.5, 0"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,3.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - FullTileLayer
  - type: Corrodible
    isCorrodible: false
    structure: true
